{% extends 'base.html' %}
{% block title %}Log in · UCA Marketplace{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <div class="card">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Log in</h1>
                <form method="post">
                    {% csrf_token %}
                    {% include 'includes/form_fields.html' %}
                    <button type="submit" class="btn btn-dark w-100">Log in</button>
                </form>
                <p class="small text-center mt-3 mb-0">
                    New here? <a href="{% url 'register' %}">Create an account</a> with your university email.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
