{% extends 'food/base.html' %}
<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    {% block body %}
    
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <form method="get">
                    <div class="card card-sm">
                        <div class="card-body row no-gutters align-items-center">
                            <div class="col">
                                <input class="form-control form-control-lg form-control-borderless" type="search" name="search_item" placeholder="Search for products">
                            </div>
                            <div class="col-auto">
                                <button class="btn btn-lg btn-success" type="submit">Search</button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="row">
            {% for product in item_list %}
            <div class="col-md-3">
                    <div class="card">
                        <img src="{{ product.item_image }}" class="card-img-top">
                        <div class="card-body">
                            <div class="card-title">
                                
                                {{ product.item_name }}
                                <br>
                                {{ product.user_name }}
                            </div>
                            <div class="card-text">
                                
                                ${{ product.item_price }}
                            </div>
                            <a href="/food/{{ product.id }}" class="btn btn-warning">View</a>
                            <a class="btn btn-warning">Add to cart</a>
                        </div>
                    </div>
            </div>
        {% endfor %}
    
    
    
    
    </div>
