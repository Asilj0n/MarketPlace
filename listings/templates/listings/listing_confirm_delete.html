{% extends 'base.html' %}
{% block title %}Delete listing · UCA Marketplace{% endblock %}
{% block body %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-body p-4">
            <h1 class="h5">Delete "{{ listing.title }}"?</h1>
            <p class="text-muted">This can't be undone. If the item was sold, you can mark it as sold instead.</p>
            <form method="post" class="d-flex gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, delete it</button>
                <a href="{{ listing.get_absolute_url }}" class="btn btn-link">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
